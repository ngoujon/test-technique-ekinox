name: CI

on:
  push:
    branches: [main]
  pull_request:

# Principe du moindre privilège pour le jeton GitHub. Les actions tierces sont épinglées
# par SHA de commit (immuable, contrairement à un tag) et mises à jour par Dependabot.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Format, lint, typage et tests avec couverture
        run: npm run verify
      - run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t bttf-dvd-shop .
