name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur une branche annule la vérification encore en cours sur cette branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Principe du moindre privilège pour le jeton GitHub. Les actions tierces sont épinglées
# par SHA de commit (immuable, contrairement à un tag) et mises à jour par Dependabot.
permissions:
  contents: read

jobs:
  verify:
    name: Vérifications (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Format, lint, typage et tests avec couverture
        run: npm run verify
      - run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t bttf-dvd-shop .
      - name: Test de fumée du conteneur
        run: |
          docker run -d --name app -p 3000:3000 bttf-dvd-shop
          # Attend que le serveur réponde, 30 secondes au plus.
          for _ in $(seq 30); do curl -sf http://localhost:3000/health && break; sleep 1; done
          # Exemple n°5 de l'énoncé : le total attendu est de 56 €.
          curl -sf http://localhost:3000/api/quotes \
            -H 'Content-Type: application/json' \
            -d '{"cart": "Back to the Future 1\nBack to the Future 2\nBack to the Future 3\nLa chèvre"}' \
            | grep -q '"totalCents":5600'
          # Le processus ne doit pas tourner en root.
          test "$(docker exec app whoami)" = node
      - name: Journaux du conteneur
        if: failure()
        run: docker logs app
