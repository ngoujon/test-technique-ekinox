name: CI

on:
  push:
    branches: [main]
  pull_request:

# Principe du moindre privilège pour le jeton GitHub.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Format, lint, typage et tests avec couverture
        run: npm run verify
      - run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t bttf-dvd-shop .
